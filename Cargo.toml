[workspace]
resolver = "2"
members = [
    "crates/open-360-link-protocol",
    "crates/open-360-link-cli",
    "crates/open-360-link-gui",
    "crates/open-360-link-server",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Lucas Oskorep <lucas.oskorep@gmail.com>"]
repository = "https://github.com/lucasoskorep/open-360-link"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bitflags = { version = "2.6", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nusb = "0.1"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
eframe = "0.29"
egui = "0.29"
